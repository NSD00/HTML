<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Макс — ЖК «Якоби-Парк»</title>
    <link rel="icon" href="favicon.ico">

    <!-- <meta http-equiv="refresh" content="10; URL=https://max.ru/join/6f4XAEqMGQY6RSePlbq4Y02-dL-mpjecFTX8A57i6vU"> -->

    <style>
        :root {
            --color-text: #1a1a2e;
            --color-text-secondary: #6b7280;
            --color-text-muted: #9ca3af;
            --color-text-body: #4b5563;

            --color-background: #f0f2f5;
            --color-background-dark: #e6e9ed;
            --color-surface: #ffffff;
            --color-surface-soft: #f8f9fa;

            --color-border: #eef2f6;
            --color-border-soft: #f0f2f5;

            --color-accent: #7c3aed;

            --radius-card: 24px;
            --radius-large: 32px;
            --radius-pill: 60px;

            --shadow-card:
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.04);

            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(
                145deg,
                var(--color-background),
                var(--color-background-dark)
            );
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px 32px;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: var(--color-text-secondary);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            text-decoration: none;
            transition: color var(--transition);
        }

        .back:hover {
            color: var(--color-text);
        }

        .icon-wrap {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            background: var(--color-accent);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.30);
        }

        .icon-wrap img {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            padding: 3px;
        }

        .desc {
            margin-bottom: 4px;
            color: var(--color-text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        h1 {
            color: var(--color-text);
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .qr-wrapper {
            display: inline-block;
            margin-top: 20px;
            padding: 16px;
            background: var(--color-surface-soft);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
        }

        .qr-wrapper a {
            display: block;
            text-decoration: none;
        }

        .qr-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .qr-label {
            margin-top: 12px;
            color: var(--color-text-body);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }

        .qr-label span {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 10px;
            background: var(--color-border);
            border-radius: 12px;
            color: var(--color-text-secondary);
            font-size: 12px;
            font-weight: 400;
        }

        .instruction {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border-soft);
            color: var(--color-text-body);
            font-size: 14px;
            line-height: 1.5;
        }

        .instruction strong {
            color: var(--color-text);
            font-weight: 600;
        }

        .footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--color-border-soft);
            color: var(--color-text-muted);
            font-size: 13px;
            line-height: 1.4;
        }

        @media (max-width: 550px) {
            body {
                padding: 16px 12px;
            }

            .card {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }

            .icon-wrap {
                width: 84px;
                height: 84px;
            }

            .qr-wrapper {
                padding: 14px;
            }

            .qr-wrapper img {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <a href="index.html" class="back">← Назад</a>

        <div class="icon-wrap">
            <img
                src="images/icon-max.png"
                alt="Макс"
                width="48"
                height="48"
            >
        </div>

        <p class="desc">Присоединяйтесь к нашему чату в</p>
        <h1>Макс</h1>

        <div class="qr-wrapper">
            <a
                href="https://max.ru/join/6f4XAEqMGQY6RSePlbq4Y02-dL-mpjecFTX8A57i6vU"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img
                    src="images/qr-max.png"
                    alt="QR-код Макс"
                    width="200"
                    height="200"
                >
            </a>
        </div>

        <p class="qr-label">
            Наведите камеру или кликните по QR-коду
            <br>
            <span>для перехода в общий чат ЖК</span>
        </p>

        <div class="instruction">
            <strong>Чтобы попасть в чат своего дома,</strong><br>
            откройте приложение «Госуслуги.Дом» и на главном экране выберите раздел «Домовой чат».
        </div>

        <footer class="footer">
            ЖК «Якоби-Парк»
        </footer>
    </main>
</body>
</html>
