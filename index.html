<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК «Якоби-Парк»</title>
    <link rel="icon" href="favicon.ico">

    <style>
        :root {
            --color-text: #1a1a2e;
            --color-text-secondary: #6b7280;
            --color-text-muted: #9ca3af;
            --color-text-body: #2d3a4a;

            --color-background: #f0f2f5;
            --color-background-dark: #e6e9ed;
            --color-surface: #ffffff;
            --color-surface-soft: #f8fafc;

            --color-border: #edf2f7;
            --color-border-soft: #f0f2f5;

            --color-telegram: #2aabee;
            --color-telegram-dark: #1b8bc9;

            --color-max: #7c3aed;
            --color-max-dark: #6d28d9;

            --radius-card: 24px;
            --radius-large: 32px;
            --radius-pill: 60px;

            --shadow-card:
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.04);

            --shadow-button:
                0 4px 12px rgba(0, 0, 0, 0.08);

            --transition: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(
                145deg,
                var(--color-background),
                var(--color-background-dark)
            );
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 40px 36px 32px;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        .logo {
            margin-bottom: 8px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            display: block;
            margin: 0 auto;
            object-fit: cover;
        }

        h1 {
            color: var(--color-text);
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.3px;
        }

        .subtitle {
            margin-top: 6px;
            margin-bottom: 32px;
            color: var(--color-text-secondary);
            font-size: 16px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border: 0;
            border-radius: var(--radius-pill);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
            text-decoration: none;
            box-shadow: var(--shadow-button);
            transition:
                transform var(--transition),
                box-shadow var(--transition);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-telegram {
            background: linear-gradient(
                145deg,
                var(--color-telegram),
                var(--color-telegram-dark)
            );
        }

        .btn-max {
            background: linear-gradient(
                145deg,
                var(--color-max),
                var(--color-max-dark)
            );
        }

        .btn img {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            padding: 2px;
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border-soft);
            color: var(--color-text-muted);
            font-size: 13px;
            line-height: 1.4;
        }

        @media (max-width: 550px) {
            body {
                padding: 16px 12px;
            }

            .card {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }

            .logo img {
                width: 72px;
                height: 72px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 28px;
                font-size: 15px;
            }

            .btn {
                padding: 15px 20px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">
            <img
                src="images/logo-complex.png"
                alt="ЖК «Якоби-Парк»"
                width="80"
                height="80"
            >
        </div>

        <h1>ЖК «Якоби-Парк»</h1>
        <p class="subtitle">Выберите предпочитаемый мессенджер</p>

        <nav class="links" aria-label="Мессенджеры">
            <a href="telegram.html" class="btn btn-telegram">
                <img
                    src="images/icon-telegram.png"
                    alt="Telegram"
                    width="32"
                    height="32"
                >
                Telegram
            </a>

            <a href="max.html" class="btn btn-max">
                <img
                    src="images/icon-max.png"
                    alt="Макс"
                    width="32"
                    height="32"
                >
                Макс
            </a>
        </nav>

        <footer class="footer">
            ЖК «Якоби-Парк» • Живу на берегу
        </footer>
    </main>
</body>
</html>
